deptrac:
  paths:
    - Classes
  layers:
    - name: Domain
      collectors:
        - type: directory
          value: Classes/Domain/.*
    - name: Application
      collectors:
        - type: directory
          value: Classes/Application/.*
    - name: Infrastructure
      collectors:
        - type: directory
          value: Classes/Infrastructure/.*
    - name: Presentation
      collectors:
        - type: directory
          value: Classes/Presentation/.*
    - name: Framework
      collectors:
        - type: classLike
          value: TYPO3\\CMS\\.*|Psr\\.*|Doctrine\\DBAL\\.*|Symfony\\Component\\.*
  ruleset:
    Domain: []
    Application:
      - Domain
    Infrastructure:
      - Application
      - Domain
      - Framework
    Presentation:
      - Application
      - Domain
      - Framework
    Framework: []

  # Pre-existing violations from the qossmic/deptrac → deptrac/deptrac v3
  # migration day. Tracked as separate refactor; new violations on top
  # still fail the build.
  skip_violations:
    Koh\AiWorkflows\Application\Service\WorkflowEngine:
      - Psr\EventDispatcher\EventDispatcherInterface
    Koh\AiWorkflows\Domain\Contract\WorkflowParserInterface:
      - Koh\AiWorkflows\Application\Exception\InvalidWorkflowDefinitionException
    Koh\AiWorkflows\Presentation\Controller\ReviewController:
      - Koh\AiWorkflows\Infrastructure\Persistence\Model\ReviewTask
