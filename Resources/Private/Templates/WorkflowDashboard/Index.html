<html data-namespace-typo3-fluid="true"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers">
<f:layout name="Default" />
<f:section name="Content">
    <h1><f:translate key="LLL:EXT:ai_workflows/Resources/Private/Language/locallang.xlf:dashboard.title" /></h1>
    <h2><f:translate key="LLL:EXT:ai_workflows/Resources/Private/Language/locallang.xlf:dashboard.availableWorkflows" /></h2>
    <f:if condition="{workflows}">
        <f:then>
            <table class="table table-striped table-hover">
                <thead><tr><th><f:translate key="LLL:EXT:ai_workflows/Resources/Private/Language/locallang.xlf:table.name" /></th><th><f:translate key="LLL:EXT:ai_workflows/Resources/Private/Language/locallang.xlf:table.description" /></th><th><f:translate key="LLL:EXT:ai_workflows/Resources/Private/Language/locallang.xlf:table.trigger" /></th><th><f:translate key="LLL:EXT:ai_workflows/Resources/Private/Language/locallang.xlf:table.actions" /></th></tr></thead>
                <tbody>
                    <f:for each="{workflows}" as="workflow" key="key">
                        <tr>
                            <td>{workflow.name}</td><td>{workflow.description}</td><td>{workflow.trigger.type.value}</td>
                            <td><f:link.action action="start" arguments="{workflowName: key}" class="btn btn-primary btn-sm"><f:translate key="LLL:EXT:ai_workflows/Resources/Private/Language/locallang.xlf:button.start" /></f:link.action></td>
                        </tr>
                    </f:for>
                </tbody>
            </table>
        </f:then>
        <f:else><div class="callout callout-info"><f:translate key="LLL:EXT:ai_workflows/Resources/Private/Language/locallang.xlf:dashboard.noWorkflowDefinitions" /></div></f:else>
    </f:if>
    <h2><f:translate key="LLL:EXT:ai_workflows/Resources/Private/Language/locallang.xlf:dashboard.runningWorkflows" /></h2>
    <f:if condition="{runningInstances}">
        <f:then>
            <table class="table table-striped">
                <thead><tr><th><f:translate key="LLL:EXT:ai_workflows/Resources/Private/Language/locallang.xlf:table.number" /></th><th><f:translate key="LLL:EXT:ai_workflows/Resources/Private/Language/locallang.xlf:table.workflow" /></th><th><f:translate key="LLL:EXT:ai_workflows/Resources/Private/Language/locallang.xlf:table.currentStep" /></th><th><f:translate key="LLL:EXT:ai_workflows/Resources/Private/Language/locallang.xlf:table.startedAt" /></th><th><f:translate key="LLL:EXT:ai_workflows/Resources/Private/Language/locallang.xlf:table.actions" /></th></tr></thead>
                <tbody>
                    <f:for each="{runningInstances}" as="instance">
                        <tr><td>{instance.uid}</td><td>{instance.workflowName}</td><td>{instance.currentStep}</td>
                            <td><f:format.date format="Y-m-d H:i">{instance.startedAt}</f:format.date></td>
                            <td><f:link.action action="show" arguments="{uid: instance.uid}" class="btn btn-default btn-sm"><f:translate key="LLL:EXT:ai_workflows/Resources/Private/Language/locallang.xlf:button.details" /></f:link.action></td></tr>
                    </f:for>
                </tbody>
            </table>
        </f:then>
        <f:else><div class="callout callout-info"><f:translate key="LLL:EXT:ai_workflows/Resources/Private/Language/locallang.xlf:dashboard.noRunningWorkflows" /></div></f:else>
    </f:if>
    <h2><f:translate key="LLL:EXT:ai_workflows/Resources/Private/Language/locallang.xlf:dashboard.pausedWorkflows" /></h2>
    <f:if condition="{pausedInstances}">
        <f:then>
            <table class="table table-striped">
                <thead><tr><th><f:translate key="LLL:EXT:ai_workflows/Resources/Private/Language/locallang.xlf:table.number" /></th><th><f:translate key="LLL:EXT:ai_workflows/Resources/Private/Language/locallang.xlf:table.workflow" /></th><th><f:translate key="LLL:EXT:ai_workflows/Resources/Private/Language/locallang.xlf:table.pausedAtStep" /></th><th><f:translate key="LLL:EXT:ai_workflows/Resources/Private/Language/locallang.xlf:table.actions" /></th></tr></thead>
                <tbody>
                    <f:for each="{pausedInstances}" as="instance">
                        <tr><td>{instance.uid}</td><td>{instance.workflowName}</td><td>{instance.currentStep}</td>
                            <td><f:link.action action="show" arguments="{uid: instance.uid}" class="btn btn-warning btn-sm"><f:translate key="LLL:EXT:ai_workflows/Resources/Private/Language/locallang.xlf:button.review" /></f:link.action></td></tr>
                    </f:for>
                </tbody>
            </table>
        </f:then>
        <f:else><div class="callout callout-info"><f:translate key="LLL:EXT:ai_workflows/Resources/Private/Language/locallang.xlf:dashboard.noPausedWorkflows" /></div></f:else>
    </f:if>
</f:section>
</html>
